name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > android/app/release.keystore

      - name: Build Android APK (release)
        run: |
          cd android && ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List APK files
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "VoidChatApp-*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK")" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Send Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch release notes
          NOTES=$(gh release view "${TAG}" --json body --jq '.body' 2>/dev/null || echo "")
          if [ -n "$NOTES" ]; then
            # Convert markdown bold to HTML bold
            NOTES=$(echo "$NOTES" | sed 's/\*\*\([^*]*\)\*\*/<b>\1<\/b>/g')
            # Truncate to 900 chars
            if [ ${#NOTES} -gt 900 ]; then
              NOTES="${NOTES:0:900}..."
            fi
          fi

          # Write caption to file (actual newlines, not %0A)
          {
            printf '<b>🚀 VoidChatApp %s released!</b>\n' "${TAG}"
            printf '📦 %s\n' "${APK_NAME}"
            printf '\n'
            if [ -n "$NOTES" ]; then
              printf '<b>📋 Что нового:</b>\n'
              printf '%s\n' "${NOTES}"
              printf '\n'
            fi
            printf '🔗 <a href="https://github.com/%s/releases/tag/%s">Открыть релиз</a>\n' \
              "${GITHUB_REPOSITORY}" "${TAG}"
          } > caption.txt

          # Send ONE message: document with HTML caption
          curl -s -S -X POST \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=<caption.txt" \
            -F "parse_mode=HTML" \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" || echo "curl exit code: $?"
