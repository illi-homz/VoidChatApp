name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > android/app/release.keystore

      - name: Build Android APK (release)
        run: |
          cd android && ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List APK files
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "VoidChatApp-*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK")" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Fetch release notes and compose message
        run: |
          # Small pause to let GitHub finish generating release notes
          sleep 2
          gh release view "${{ github.ref_name }}" --json body --jq '.body' > release_notes.md
          # Truncate to ~1500 chars to stay within Telegram limits.
          # Use head -c (safe for ASCII-only release notes).
          NOTES=$(head -c 1500 release_notes.md)
          if [ "$(wc -c < release_notes.md)" -gt 1500 ]; then
            NOTES="${NOTES}..."
          fi
          # Fallback for empty release notes
          if [ -z "$NOTES" ]; then
            NOTES="(нет описания)"
          fi
          # Write full message to file
          {
            printf '🚀 <b>VoidChatApp %s released!</b>\n\n' "$TAG"
            printf '📦 %s\n\n' "$APK_NAME"
            printf '📋 <b>Что нового:</b>\n'
            printf '%s\n' "$NOTES"
          } > telegram_message.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.apk.outputs.name }}

      - name: Telegram notification
        continue-on-error: true
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: telegram_message.txt
          document: ${{ steps.apk.outputs.path }}
          format: html
