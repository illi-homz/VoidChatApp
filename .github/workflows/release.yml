name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets 2>/dev/null | grep -q '"name":.*\.apk'; then
            echo "APK already published, skipping build"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.check_release.outputs.skip_build != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        if: steps.check_release.outputs.skip_build != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_release.outputs.skip_build != 'true'
        run: npm ci

      - name: Decode keystore
        if: steps.check_release.outputs.skip_build != 'true'
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > android/app/release.keystore

      - name: Build Android APK (release)
        if: steps.check_release.outputs.skip_build != 'true'
        run: |
          cd android && ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List APK files
        if: steps.check_release.outputs.skip_build != 'true'
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: Locate APK
        if: steps.check_release.outputs.skip_build != 'true'
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "VoidChatApp-*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK")" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_release.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="${{ steps.apk.outputs.path }}"
          TAG="${{ github.ref_name }}"

          if [ -f "RELEASE_NOTES.md" ]; then
            gh release create "${TAG}" "${APK_PATH}" \
              --target "main" \
              --notes-file "RELEASE_NOTES.md"
          else
            gh release create "${TAG}" "${APK_PATH}" \
              --target "main" \
              --generate-notes
          fi

      - name: Send Telegram notification
        if: steps.check_release.outputs.skip_build != 'true'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Читаем release notes напрямую из RELEASE_NOTES.md
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES=$(sed \
              -e 's/### \(.*\)/<b>\1<\/b>/g' \
              -e 's/\*\*\([^*]*\)\*\*/<b>\1<\/b>/g' \
              -e 's/\*\([^*]*\)\*/<i>\1<\/i>/g' \
              -e 's/^[-*] /• /g' \
              -e 's/^# //g' \
              "RELEASE_NOTES.md")
            if [ ${#NOTES} -gt 900 ]; then
              NOTES="${NOTES:0:900}..."
            fi
          else
            NOTES=""
          fi

          {
            printf '<b>🚀 VoidChatApp %s</b>\n' "${TAG}"
            printf '\n'
            if [ -n "$NOTES" ]; then
              printf '<b>📋 Что нового:</b>\n'
              printf '%s\n' "$NOTES"
              printf '\n'
            fi
            printf '📦 <code>%s</code>\n' "${APK_NAME}"
            printf '🔗 <a href="https://github.com/%s/releases/tag/%s">Полный список изменений</a>\n' \
              "${GITHUB_REPOSITORY}" "${TAG}"
          } > caption.txt

          if [ -n "${APK_PATH}" ] && [ -f "${APK_PATH}" ]; then
            curl -s -S -X POST \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK_PATH}" \
              -F "caption=<caption.txt" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" || echo "curl exit code: $?"
          fi
